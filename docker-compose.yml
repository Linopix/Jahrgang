name: jahrgang

services:
  jahrgang:
    build:
      context: .
      dockerfile: Dockerfile
    image: jahrgang:local
    ports:
      - "${JAHRGANG_PORT:-8080}:8080"
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "8080"
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI:-}
      SPOTIFY_MARKET: ${SPOTIFY_MARKET:-}
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
        required: false
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s

  db:
    profiles: ["db"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jahrgang
      POSTGRES_PASSWORD: jahrgang
      POSTGRES_DB: jahrgang
    volumes:
      - jahrgang_pg:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jahrgang -d jahrgang"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  jahrgang_pg:
