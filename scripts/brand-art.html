<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Figtree:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #000; }
      .card {
        position: relative;
        overflow: hidden;
        background: #0c0b0a;
        color: #efe8d8;
      }
      .card::before {
        content: "";
        position: absolute;
        inset: -20%;
        background:
          radial-gradient(circle at 28% 42%, rgb(242 238 230 / 0.08), transparent 36%),
          radial-gradient(circle at 78% 18%, rgb(196 165 116 / 0.12), transparent 32%),
          repeating-radial-gradient(circle at 22% 54%, rgb(242 238 230 / 0.025) 0 1px, transparent 2px 8px);
        pointer-events: none;
      }
      .vinyl {
        position: absolute;
        border-radius: 50%;
        background:
          radial-gradient(circle at 50% 50%, #efe8d8 0 13.5%, transparent 13.7% 100%),
          radial-gradient(circle at 50% 50%, #2a241c 0 16%, transparent 16.2%),
          repeating-radial-gradient(circle at 50% 50%, #161412 0 1px, #0e0c0a 2px 3px);
        box-shadow:
          inset 0 0 0 1px rgb(242 238 230 / 0.1),
          0 40px 80px -24px rgb(0 0 0 / 0.9);
      }
      .vinyl .hole {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 3.2%;
        height: 3.2%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: #0c0b0a;
      }
      .kicker {
        font-family: Figtree, sans-serif;
        font-weight: 600;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: #c4a574;
      }
      .title {
        font-family: Fraunces, serif;
        font-optical-sizing: auto;
        font-weight: 500;
        letter-spacing: -0.03em;
        line-height: 0.9;
      }
      .lede {
        font-family: Figtree, sans-serif;
        font-weight: 500;
        color: #b8b0a4;
      }
      .years {
        font-family: Fraunces, serif;
        font-variant-numeric: tabular-nums;
        color: #efe8d8;
        letter-spacing: 0.12em;
      }
      #og { width: 1200px; height: 630px; }
      #og .vinyl { width: 520px; height: 520px; right: -90px; top: 56px; }
      #og .copy { position: relative; z-index: 1; padding: 88px 64px; max-width: 720px; }
      #og .kicker { font-size: 18px; }
      #og .title { margin-top: 22px; font-size: 118px; }
      #og .lede { margin-top: 28px; font-size: 28px; max-width: 520px; line-height: 1.35; }
      #og .years { position: absolute; left: 64px; bottom: 52px; font-size: 20px; }
      #banner { width: 1200px; height: 264px; margin-top: 24px; }
      #banner .vinyl { width: 340px; height: 340px; right: -40px; top: -38px; }
      #banner .copy { position: relative; z-index: 1; padding: 48px 56px; }
      #banner .kicker { font-size: 14px; }
      #banner .title { margin-top: 10px; font-size: 84px; }
      #banner .lede { margin-top: 12px; font-size: 22px; }
      #icon { width: 180px; height: 180px; margin-top: 24px; border-radius: 40px; }
      #icon .vinyl { width: 148px; height: 148px; left: 16px; top: 16px; }
    </style>
  </head>
  <body>
    <div id="og" class="card">
      <div class="vinyl"><i class="hole"></i></div>
      <div class="copy">
        <p class="kicker">Musik-Zeitspiel</p>
        <h1 class="title">Jahrgang</h1>
        <p class="lede">Einen Hit hören und auf die Zeitlinie legen. Am Tisch, online oder allein.</p>
      </div>
      <p class="years">1962 · 1987 · 2004 · 2019</p>
    </div>
    <div id="banner" class="card">
      <div class="vinyl"><i class="hole"></i></div>
      <div class="copy">
        <p class="kicker">Musik-Zeitspiel</p>
        <h1 class="title">Jahrgang</h1>
        <p class="lede">Hören. Legen. Das Jahr treffen.</p>
      </div>
    </div>
    <div id="icon" class="card">
      <div class="vinyl"><i class="hole"></i></div>
    </div>
  </body>
</html>
